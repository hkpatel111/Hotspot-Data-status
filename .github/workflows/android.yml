name: Build Data Reporter v4.2 Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configure Android SDK Paths
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Create Project Directories
      run: |
        mkdir -p app/src/main/java/com/hotspot/gateway
        mkdir -p app/src/main/res/layout

    - name: Generate Layout XML
      run: |
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:fillViewport="true"
            android:background="#F5F6FA">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:padding="16dp">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Data Reporter v4.2 Pro"
                    android:textSize="24sp"
                    android:textStyle="bold"
                    android:textColor="#111827" />

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Foreground Persistence + Granular SMS Toggles"
                    android:textSize="13sp"
                    android:textColor="#6B7280"
                    android:layout_marginBottom="16dp" />

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:background="#FFFFFF"
                    android:padding="16dp"
                    android:elevation="2dp"
                    android:layout_marginBottom="16dp">

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="Target Phone Number"
                        android:textStyle="bold"
                        android:textColor="#374151"
                        android:layout_marginBottom="4dp" />

                    <EditText
                        android:id="@+id/etTargetNumber"
                        android:layout_width="match_parent"
                        android:layout_height="45dp"
                        android:hint="e.g. +919876543210"
                        android:inputType="phone"
                        android:textSize="14sp"
                        android:paddingHorizontal="8dp"
                        android:layout_marginBottom="12dp" />

                    <Switch
                        android:id="@+id/switchForeground"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="Run in Foreground (Prevent App Kill)"
                        android:textSize="14sp"
                        android:textStyle="bold"
                        android:textColor="#4F46E5"
                        android:paddingVertical="8dp" />

                    <Switch
                        android:id="@+id/switchBootHotspot"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="Auto Hotspot on Device Boot"
                        android:textSize="14sp"
                        android:textStyle="bold"
                        android:textColor="#374151"
                        android:paddingVertical="8dp" />

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="Granular SMS Command Toggles"
                        android:textSize="14sp"
                        android:textStyle="bold"
                        android:textColor="#059669"
                        android:layout_marginTop="8dp"
                        android:layout_marginBottom="4dp" />

                    <Switch
                        android:id="@+id/switchSmsForwardAll"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="Forward All Incoming SMS"
                        android:textSize="13sp"
                        android:textColor="#374151"
                        android:paddingVertical="4dp" />

                    <Switch
                        android:id="@+id/switchSmsHotspotCmd"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="Allow SMS Hotspot Control (HOTSPOT_ON/OFF)"
                        android:textSize="13sp"
                        android:textColor="#374151"
                        android:paddingVertical="4dp" />

                    <Switch
                        android:id="@+id/switchSmsStatusCmd"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="Allow SMS Status/5G Query (GET_STATUS)"
                        android:textSize="13sp"
                        android:textColor="#374151"
                        android:paddingVertical="4dp" />

                    <Switch
                        android:id="@+id/switchSmsRefreshCmd"
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:text="Allow SMS Refresh/Restart Cmd (REFRESH)"
                        android:textSize="13sp"
                        android:textColor="#374151"
                        android:paddingVertical="4dp"
                        android:layout_marginBottom="12dp" />

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="horizontal"
                        android:weightSum="2"
                        android:layout_marginBottom="8dp">

                        <Button
                            android:id="@+id/btnSave"
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:text="SAVE &amp; APPLY"
                            android:backgroundTint="#4F46E5"
                            android:textColor="#FFFFFF"
                            android:layout_marginRight="4dp" />

                        <Button
                            android:id="@+id/btnRefresh"
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:text="REFRESH STATS"
                            android:backgroundTint="#4B5563"
                            android:textColor="#FFFFFF"
                            android:layout_marginLeft="4dp" />
                    </LinearLayout>

                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="horizontal"
                        android:weightSum="2">

                        <Button
                            android:id="@+id/btnSendNow"
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:text="SEND REPORT NOW"
                            android:backgroundTint="#059669"
                            android:textColor="#FFFFFF"
                            android:layout_marginRight="4dp" />

                        <Button
                            android:id="@+id/btnClearData"
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:text="CLEAR DATA"
                            android:backgroundTint="#DC2626"
                            android:textColor="#FFFFFF"
                            android:layout_marginLeft="4dp" />
                    </LinearLayout>

                </LinearLayout>

                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:background="#E5E7EB"
                    android:padding="10dp"
                    android:layout_marginBottom="16dp">

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="MacroDroid Integration File Path:"
                        android:textSize="12sp"
                        android:textStyle="bold"
                        android:textColor="#374151" />

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="/storage/emulated/0/Android/data/com.hotspot.gateway/files/DataReporter/data.txt"
                        android:textSize="11sp"
                        android:textColor="#4B5563"
                        android:fontFamily="monospace" />
                </LinearLayout>

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Live System Stats &amp; Preview"
                    android:textSize="18sp"
                    android:textStyle="bold"
                    android:textColor="#111827"
                    android:layout_marginBottom="8dp" />

                <TextView
                    android:id="@+id/tvLiveStats"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:background="#FFFFFF"
                    android:padding="12dp"
                    android:textSize="13sp"
                    android:textColor="#1F2937"
                    android:fontFamily="monospace"
                    android:text="Initializing stats..."
                    android:elevation="1dp" />

            </LinearLayout>
        </ScrollView>
        EOF

    - name: Generate AndroidManifest XML
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.hotspot.gateway">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
            <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.SEND_SMS" />
            <uses-permission android:name="android.permission.RECEIVE_SMS" />
            <uses-permission android:name="android.permission.READ_SMS" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            
            <application 
                android:allowBackup="true" 
                android:label="Data Reporter v4.2" 
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                
                <service 
                    android:name=".HotspotService" 
                    android:enabled="true" 
                    android:exported="false" 
                    android:foregroundServiceType="dataSync" />
                
                <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true" android:permission="android.permission.RECEIVE_BOOT_COMPLETED">
                    <intent-filter>
                        <action android:name="android.intent.action.BOOT_COMPLETED" />
                    </intent-filter>
                </receiver>
                
                <receiver android:name=".SmsReceiver" android:enabled="true" android:exported="true">
                    <intent-filter android:priority="999">
                        <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                    </intent-filter>
                </receiver>
            </application>
        </manifest>
        EOF

    - name: Generate Kotlin Source Files
      run: |
        cat << 'EOF' > app/src/main/java/com/hotspot/gateway/MainActivity.kt
        package com.hotspot.gateway

        import android.content.Context
        import android.content.Intent
        import android.net.ConnectivityManager
        import android.net.NetworkCapabilities
        import android.net.wifi.WifiManager
        import android.os.BatteryManager
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.content.ContextCompat
        import java.io.File
        import java.text.SimpleDateFormat
        import java.util.*

        class MainActivity : AppCompatActivity() {

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                val etTargetNumber = findViewById<EditText>(R.id.etTargetNumber)
                val switchForeground = findViewById<Switch>(R.id.switchForeground)
                val switchBootHotspot = findViewById<Switch>(R.id.switchBootHotspot)
                val switchSmsForwardAll = findViewById<Switch>(R.id.switchSmsForwardAll)
                val switchSmsHotspotCmd = findViewById<Switch>(R.id.switchSmsHotspotCmd)
                val switchSmsStatusCmd = findViewById<Switch>(R.id.switchSmsStatusCmd)
                val switchSmsRefreshCmd = findViewById<Switch>(R.id.switchSmsRefreshCmd)
                
                val btnSave = findViewById<Button>(R.id.btnSave)
                val btnRefresh = findViewById<Button>(R.id.btnRefresh)
                val btnSendNow = findViewById<Button>(R.id.btnSendNow)
                val btnClearData = findViewById<Button>(R.id.btnClearData)
                val tvLiveStats = findViewById<TextView>(R.id.tvLiveStats)

                val sharedPreferences = getSharedPreferences("DataReporterPrefs", Context.MODE_PRIVATE)

                etTargetNumber.setText(sharedPreferences.getString("target_number", ""))
                switchForeground.isChecked = sharedPreferences.getBoolean("run_foreground", false)
                switchBootHotspot.isChecked = sharedPreferences.getBoolean("boot_hotspot", false)
                switchSmsForwardAll.isChecked = sharedPreferences.getBoolean("sms_forward_all", false)
                switchSmsHotspotCmd.isChecked = sharedPreferences.getBoolean("sms_hotspot_cmd", true)
                switchSmsStatusCmd.isChecked = sharedPreferences.getBoolean("sms_status_cmd", true)
                switchSmsRefreshCmd.isChecked = sharedPreferences.getBoolean("sms_refresh_cmd", true)

                val refreshStats = {
                    val stats = getRealTimeStats(this)
                    tvLiveStats.text = stats
                    saveStatsToFile(this, stats)
                }

                refreshStats()

                btnSave.setOnClickListener {
                    val number = etTargetNumber.text.toString().trim()
                    val isForeground = switchForeground.isChecked

                    sharedPreferences.edit().apply {
                        putString("target_number", number)
                        putBoolean("run_foreground", isForeground)
                        putBoolean("boot_hotspot", switchBootHotspot.isChecked)
                        putBoolean("sms_forward_all", switchSmsForwardAll.isChecked)
                        putBoolean("sms_hotspot_cmd", switchSmsHotspotCmd.isChecked)
                        putBoolean("sms_status_cmd", switchSmsStatusCmd.isChecked)
                        putBoolean("sms_refresh_cmd", switchSmsRefreshCmd.isChecked)
                        apply()
                    }

                    val serviceIntent = Intent(this, HotspotService::class.java)
                    if (isForeground) {
                        ContextCompat.startForegroundService(this, serviceIntent)
                        Toast.makeText(this, "Foreground Service Activated!", Toast.LENGTH_SHORT).show()
                    } else {
                        stopService(serviceIntent)
                        Toast.makeText(this, "Foreground Service Stopped.", Toast.LENGTH_SHORT).show()
                    }

                    Toast.makeText(this, "Settings Saved Successfully!", Toast.LENGTH_SHORT).show()
                    refreshStats()
                }

                btnRefresh.setOnClickListener {
                    refreshStats()
                    Toast.makeText(this, "Stats Refreshed!", Toast.LENGTH_SHORT).show()
                }

                btnSendNow.setOnClickListener {
                    val target = etTargetNumber.text.toString().trim()
                    if (target.isEmpty()) {
                        Toast.makeText(this, "Please enter Target Phone Number first!", Toast.LENGTH_SHORT).show()
                    } else {
                        val stats = getRealTimeStats(this)
                        try {
                            val smsManager = android.telephony.SmsManager.getDefault()
                            smsManager.sendTextMessage(target, null, "MANUAL_REPORT:\n$stats", null, null)
                            Toast.makeText(this, "Report sent to $target", Toast.LENGTH_LONG).show()
                        } catch (e: Exception) {
                            Toast.makeText(this, "SMS failed: ${e.message}", Toast.LENGTH_LONG).show()
 
