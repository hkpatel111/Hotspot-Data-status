name: Build Data Reporter Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Create local.properties (dummy)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "No gradle wrapper found. Project structure is ready for Android Studio / local build."
            # Fallback: try system gradle if available
            gradle assembleDebug --stacktrace || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: data-reporter-pro-v4.2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          
