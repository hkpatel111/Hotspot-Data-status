name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Upgrade Gradle Wrapper to Compatible Version
      run: |
        # Purane gradle version ko hata kar Java 17 compatible Gradle 8.5 set kar rahe hain
        if [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
          sed -i 's/distributionUrl=.*$/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.5-bin.zip/g' ./gradle/wrapper/gradle-wrapper.properties
        fi
        
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        else
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
        fi

    - name: Build Debug APK with Gradle
      run: |
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hotspot-gateway-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
