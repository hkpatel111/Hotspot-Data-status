name: Build Data Reporter Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Zip File and Locate Project
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            mkdir -p unzipped_temp
            unzip -q "$ZIP_FILE" -d unzipped_temp
            
            PROJECT_PATH=$(find unzipped_temp -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
            
            if [ -n "$PROJECT_PATH" ]; then
              PROJECT_DIR=$(dirname "$PROJECT_PATH")
              echo "Project found inside: $PROJECT_DIR. Moving contents to root..."
              cp -r "$PROJECT_DIR"/* ./
            else
              echo "Standard project structure not detected, copying all contents..."
              cp -r unzipped_temp/* ./ 2>/dev/null || true
            fi
            
            rm -rf unzipped_temp "$ZIP_FILE"
            echo "Extraction and relocation completed."
          else
            echo "No zip file found. Proceeding with existing files."
          fi

      - name: Fix Missing String Resource
        run: |
          STRINGS_FILE="app/src/main/res/values/strings.xml"
          mkdir -p $(dirname "$STRINGS_FILE")
          if [ ! -f "$STRINGS_FILE" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="notification_title">Hotspot Service</string></resources>' > "$STRINGS_FILE"
          else
            if ! grep -q "notification_title" "$STRINGS_FILE"; then
              # Insert before the closing </resources> tag
              sed -i 's|</resources>|    <string name="notification_title">Hotspot Service</string>\n</resources>|' "$STRINGS_FILE"
            fi
          fi
          echo "String resource check completed."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew and Fix Gradle Version
        run: |
          if [ -f gradlew ]; then 
            chmod +x gradlew
            echo "Switching to compatible Gradle 8.5..."
            ./gradlew wrapper --gradle-version 8.5
          else
            echo "Generating Gradle Wrapper with version 8.5..."
            gradle wrapper --gradle-version 8.5 || true
            if [ -f gradlew ]; then chmod +x gradlew; fi
          fi

      - name: Create local.properties (dummy)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Error: Gradle wrapper could not be established."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: data-reporter-pro-v4.2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
