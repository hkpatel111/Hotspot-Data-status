name: Build Data Reporter v4.2 Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configure Android SDK Paths
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Create Project Directories
      run: |
        mkdir -p app/src/main/java/com/hotspot/gateway
        mkdir -p app/src/main/res/layout

    - name: Generate Layout XML
      run: |
        echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/layout/activity_main.xml
        echo '<ScrollView xmlns:android="http://schemas.android.com/apk/res/android"' >> app/src/main/res/layout/activity_main.xml
        echo '    android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '    android:layout_height="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '    android:fillViewport="true"' >> app/src/main/res/layout/activity_main.xml
        echo '    android:background="#F5F6FA">' >> app/src/main/res/layout/activity_main.xml
        echo '    <LinearLayout' >> app/src/main/res/layout/activity_main.xml
        echo '        android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '        android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '        android:orientation="vertical"' >> app/src/main/res/layout/activity_main.xml
        echo '        android:padding="16dp">' >> app/src/main/res/layout/activity_main.xml
        echo '        <TextView' >> app/src/main/res/layout/activity_main.xml
        echo '            android:layout_width="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:text="Data Reporter v4.2 Pro"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:textSize="24sp"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:textStyle="bold"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:textColor="#111827" />' >> app/src/main/res/layout/activity_main.xml
        echo '        <LinearLayout' >> app/src/main/res/layout/activity_main.xml
        echo '            android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:orientation="vertical"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:background="#FFFFFF"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:padding="16dp"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:layout_marginTop="16dp">' >> app/src/main/res/layout/activity_main.xml
        echo '            <EditText' >> app/src/main/res/layout/activity_main.xml
        echo '                android:id="@+id/etTargetNumber"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_height="45dp"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:hint="Target Phone Number (+91...)"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:inputType="phone"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_marginBottom="12dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '            <Switch' >> app/src/main/res/layout/activity_main.xml
        echo '                android:id="@+id/switchForeground"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:text="Run in Foreground (Prevent App Kill)"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:paddingVertical="8dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '            <Switch' >> app/src/main/res/layout/activity_main.xml
        echo '                android:id="@+id/switchBootHotspot"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:text="Auto Hotspot on Boot"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:paddingVertical="8dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '            <Switch' >> app/src/main/res/layout/activity_main.xml
        echo '                android:id="@+id/switchSmsForwardAll"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:text="Forward All Incoming SMS"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:paddingVertical="8dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '            <Switch' >> app/src/main/res/layout/activity_main.xml
        echo '                android:id="@+id/switchSmsHotspotCmd"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:text="Allow SMS Hotspot Control (HOTSPOT_ON/OFF)"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:paddingVertical="8dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '            <Switch' >> app/src/main/res/layout/activity_main.xml
        echo '                android:id="@+id/switchSmsStatusCmd"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:text="Allow SMS Status/5G Query (GET_STATUS)"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:paddingVertical="8dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '            <Switch' >> app/src/main/res/layout/activity_main.xml
        echo '                android:id="@+id/switchSmsRefreshCmd"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:text="Allow SMS Refresh Cmd (REFRESH)"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:paddingVertical="8dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '            <Button' >> app/src/main/res/layout/activity_main.xml
        echo '                android:id="@+id/btnSave"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:text="SAVE CONFIGURATION"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:backgroundTint="#4F46E5"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:textColor="#FFFFFF"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_marginTop="12dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '            <Button' >> app/src/main/res/layout/activity_main.xml
        echo '                android:id="@+id/btnRefresh"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:text="REFRESH STATS"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:backgroundTint="#4B5563"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:textColor="#FFFFFF"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_marginTop="8dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '            <Button' >> app/src/main/res/layout/activity_main.xml
        echo '                android:id="@+id/btnSendNow"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:text="SEND REPORT NOW"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:backgroundTint="#059669"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:textColor="#FFFFFF"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_marginTop="8dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '            <Button' >> app/src/main/res/layout/activity_main.xml
        echo '                android:id="@+id/btnClearData"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:text="CLEAR DATA"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:backgroundTint="#DC2626"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:textColor="#FFFFFF"' >> app/src/main/res/layout/activity_main.xml
        echo '                android:layout_marginTop="8dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '        </LinearLayout>' >> app/src/main/res/layout/activity_main.xml
        echo '        <TextView' >> app/src/main/res/layout/activity_main.xml
        echo '            android:id="@+id/tvLiveStats"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:background="#FFFFFF"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:padding="12dp"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:textSize="13sp"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:textColor="#1F2937"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:fontFamily="monospace"' >> app/src/main/res/layout/activity_main.xml
        echo '            android:layout_marginTop="16dp" />' >> app/src/main/res/layout/activity_main.xml
        echo '    </LinearLayout>' >> app/src/main/res/layout/activity_main.xml
        echo '</ScrollView>' >> app/src/main/res/layout/activity_main.xml

    - name: Generate AndroidManifest XML
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.hotspot.gateway">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
            <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.SEND_SMS" />
            <uses-permission android:name="android.permission.RECEIVE_SMS" />
            <uses-permission android:name="android.permission.READ_SMS" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            
            <application 
                android:allowBackup="true" 
                android:label="Data Reporter v4.2" 
                android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                
                <service 
                    android:name=".HotspotService" 
                    android:enabled="true" 
                    android:exported="false" 
                    android:foregroundServiceType="dataSync" />
                
                <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true" android:permission="android.permission.RECEIVE_BOOT_COMPLETED">
                    <intent-filter>
                        <action android:name="android.intent.action.BOOT_COMPLETED" />
                    </intent-filter>
                </receiver>
                
                <receiver android:name=".SmsReceiver" android:enabled="true" android:exported="true">
                    <intent-filter android:priority="999">
                        <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                    </intent-filter>
                </receiver>
            </application>
        </manifest>
        EOF

    - name: Generate Kotlin Source Files
      run: |
        cat << 'EOF' > app/src/main/java/com/hotspot/gateway/MainActivity.kt
        package com.hotspot.gateway

        import android.content.Context
        import android.content.Intent
        import android.net.ConnectivityManager
        import android.net.NetworkCapabilities
        import android.net.wifi.WifiManager
        import android.os.BatteryManager
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.content.ContextCompat
        import java.io.File
        import java.text.SimpleDateFormat
        import java.util.*

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                val etTargetNumber = findViewById<EditText>(R.id.etTargetNumber)
                val switchForeground = findViewById<Switch>(R.id.switchForeground)
                val switchBootHotspot = findViewById<Switch>(R.id.switchBootHotspot)
                val switchSmsForwardAll = findViewById<Switch>(R.id.switchSmsForwardAll)
                val switchSmsHotspotCmd = findViewById<Switch>(R.id.switchSmsHotspotCmd)
                val switchSmsStatusCmd = findViewById<Switch>(R.id.switchSmsStatusCmd)
                val switchSmsRefreshCmd = findViewById<Switch>(R.id.switchSmsRefreshCmd)
                
                val btnSave = findViewById<Button>(R.id.btnSave)
                val btnRefresh = findViewById<Button>(R.id.btnRefresh)
                val btnSendNow = findViewById<Button>(R.id.btnSendNow)
                val btnClearData = findViewById<Button>(R.id.btnClearData)
                val tvLiveStats = findViewById<TextView>(R.id.tvLiveStats)

                val prefs = getSharedPreferences("DataReporterPrefs", Context.MODE_PRIVATE)

                etTargetNumber.setText(prefs.getString("target_number", ""))
                switchForeground.isChecked = prefs.getBoolean("run_foreground", false)
                switchBootHotspot.isChecked = prefs.getBoolean("boot_hotspot", false)
                switchSmsForwardAll.isChecked = prefs.getBoolean("sms_forward_all", false)
                switchSmsHotspotCmd.isChecked = prefs.getBoolean("sms_hotspot_cmd", true)
                switchSmsStatusCmd.isChecked = prefs.getBoolean("sms_status_cmd", true)
                switchSmsRefreshCmd.isChecked = prefs.getBoolean("sms_refresh_cmd", true)

                val refreshStats = {
                    val stats = getRealTimeStats(this)
                    tvLiveStats.text = stats
                    saveStatsToFile(this, stats)
                }
                refreshStats()

                btnSave.setOnClickListener {
                    prefs.edit().apply {
                        putString("target_number", etTargetNumber.text.toString().trim())
                        putBoolean("run_foreground", switchForeground.isChecked)
                        putBoolean("boot_hotspot", switchBootHotspot.isChecked)
                        putBoolean("sms_forward_all", switchSmsForwardAll.isChecked)
                        putBoolean("sms_hotspot_cmd", switchSmsHotspotCmd.isChecked)
                        putBoolean("sms_status_cmd", switchSmsStatusCmd.isChecked)
                        putBoolean("sms_refresh_cmd", switchSmsRefreshCmd.isChecked)
                        apply()
                    }

                    val intent = Intent(this, HotspotService::class.java)
                    if (switchForeground.isChecked) {
                        ContextCompat.startForegroundService(this, intent)
                    } else {
                        stopService(intent)
                    }
                    Toast.makeText(this, "Saved Successfully!", Toast.LENGTH_SHORT).show()
                    refreshStats()
                }

                btnRefresh.setOnClickListener {
                    refreshStats()
                    Toast.makeText(this, "Refreshed!", Toast.LENGTH_SHORT).show()
                }

                btnSendNow.setOnClickListener {
                    val target = etTargetNumber.text.toString().trim()
                    if (target.isNotEmpty()) {
                        val stats = getRealTimeStats(this)
       
