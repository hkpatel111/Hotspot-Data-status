name: Build Data Reporter Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Zip File from Root
        run: |
          # Zip file ko dhoondhein aur extract karein
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            mkdir -p unzipped_temp
            unzip -q "$ZIP_FILE" -d unzipped_temp
            
            # Agar zip ke andar ek hi main folder hai toh uske andar ke files ko root par layein
            cd unzipped_temp
            if [ "$(ls -A | wc -l)" -eq 1 ] && [ -d "$(ls -A)" ]; then
              INNER_DIR=$(ls -A)
              cp -r "$INNER_DIR"/* ../
            else
              cp -r * ../
            fi
            cd ..
            rm -rf unzipped_temp "$ZIP_FILE"
            echo "Extraction completed successfully."
          else
            echo "No zip file found. Proceeding with existing files."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Create local.properties (dummy)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found after extraction."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: data-reporter-pro-v4.2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
